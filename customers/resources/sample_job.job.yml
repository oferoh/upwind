# A sample job for customers.

resources:
  jobs:
    sample_job:
      name: generate_data

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - notebook_task:
            notebook_path: /Workspace/Users/ofer.ohana@databricks.com/upwind_demo/01_generate_raw_csv_data
          task_key: generate_data
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
