# The main pipeline for customers

resources:
  pipelines:
    customers_etl:
      name: customers_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/customers_etl"

      libraries:
        - glob:
            include: ../src/customers_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
