# This is a Declarative Automation Bundle definition for customers.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: customers
  uuid: 1e1d26e6-75dc-414c-9a10-bd0aa2a3d613

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-2dbd9aec-bd17.cloud.databricks.com
    variables:
      catalog: workspace
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-2dbd9aec-bd17.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/ofer.ohana@databricks.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ofer.ohana@databricks.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: ofer.ohana@databricks.com
        level: CAN_MANAGE
