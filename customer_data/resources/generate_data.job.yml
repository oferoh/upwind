resources:
  jobs:
    test:
      name: generate_customer_data
      queue:
        enabled: true
      tasks:
        - notebook_task:
            notebook_path: ../generate_customer_data.ipynb
            base_parameters:
              volume_base: /Volumes/${var.catalog}/${var.schema}/raw_csv
          task_key: generate_customer_data
        - depends_on:
            - task_key: generate_customer_data
          pipeline_task:
            # Reference the bundle's own pipeline resource — DABs resolves the ID per target
            # (dev → [dev ofer_ohana] customer_demo, prod → customer_demo).
            pipeline_id: ${resources.pipelines.customer_demo.id}
          task_key: customer
